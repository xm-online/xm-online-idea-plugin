# IntelliJ Platform Artifacts Repositories -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

pluginGroup = com.icthh.xm.xme-plugin
pluginName = XME.digital
pluginRepositoryUrl = https://github.com/sergeysenja1992/xme-plugin

pluginVersion = 3.1.5

# 2026.2 (build 262) is the first release running on Java 25 (JBR 25)
pluginSinceBuild = 262


platformType = IC
platformVersion = 2026.2.0.1

platformPlugins =

# JCEF (com.intellij.ui.jcef.*) ships as the bundled `com.intellij.modules.jcef` plugin, and since 2026.1
# it is no longer implicitly visible to plugin classloaders — it must be depended on explicitly.
platformBundledPlugins = org.intellij.groovy, org.jetbrains.plugins.yaml, com.intellij.java, com.intellij.modules.json, com.intellij.modules.jcef

# Since 2025.3 IntelliLang and JSON Schema ship as bundled modules instead of being part of the platform core
platformBundledModules = intellij.platform.langInjection, intellij.json.backend

# Java 25 needs Gradle 9.1+ (both for toolchains and for running the daemon on JDK 25)
gradleVersion = 9.6.1

kotlin.stdlib.default.dependency = false

org.gradle.jvmargs = -Xmx1g -XX:MaxMetaspaceSize=768m

org.gradle.configuration-cache = false

org.gradle.caching = false
